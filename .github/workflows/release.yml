name: release

on:
  push:
    tags: ["v*"]
  # Lets you exercise the whole build matrix without cutting a release.
  workflow_dispatch:

permissions:
  contents: write
  # Lets the publish job dispatch pages.yml; see "Refresh the site" below.
  actions: write

# Re-pushing a tag supersedes the run already going for it, rather than
# racing it to publish the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target should not hide the other nine.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            test: true
          # .deb and .rpm are built from the musl targets: the binary is
          # static, so the packages depend on nothing and install anywhere.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            linux_pkg: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            linux_pkg: true
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            linux_pkg: true
          # macos-latest is arm64, so the Intel build is a cross-compile
          # against the same SDK and needs no extra tooling.
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      # Docker-based cross-compilation: brings its own linker and C toolchain,
      # which the vendored crypto in rustls needs for musl, arm and i686.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}

      # The HTTP API is in every artifact this workflow publishes, so the
      # matrix compiles it throughout. What nothing else covers is the build
      # without it: check that once, so `--no-default-features` cannot rot
      # unnoticed between releases.
      - name: Test (no default features)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo test --release --locked --no-default-features --target ${{ matrix.target }}
          cargo clippy --all-targets --locked --no-default-features --target ${{ matrix.target }}

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}

      # A tag never holds a slash, but a branch does, and workflow_dispatch
      # runs from branches: a name like "user/feature" would turn every archive
      # name into a path under a directory that does not exist.
      - name: Name the artifacts
        shell: bash
        run: echo "DS_TAG=$(echo "${GITHUB_REF_NAME:-dev}" | tr / -)" >> "$GITHUB_ENV"

      - name: Archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="ds-${DS_TAG}-${{ matrix.target }}"
          mkdir -p "staging/$name"
          cp "target/${{ matrix.target }}/release/ds" README.md LICENSE ds.1 "staging/$name/"
          cp -R docs "staging/$name/docs"
          tar -czf "$name.tar.gz" -C staging "$name"

      - name: Archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:DS_TAG
          $name = "ds-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "staging/$name" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ds.exe" "staging/$name/"
          Copy-Item "README.md","LICENSE" "staging/$name/"
          Copy-Item "docs" "staging/$name/docs" -Recurse
          Compress-Archive -Path "staging/$name" -DestinationPath "$name.zip"

      - name: Package .deb and .rpm
        if: matrix.linux_pkg
        shell: bash
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build --target ${{ matrix.target }} --output .
          cargo generate-rpm --target ${{ matrix.target }} --output .

      - name: Package .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="ds-${DS_TAG}-${{ matrix.target }}"
          mkdir -p dmg
          cp "target/${{ matrix.target }}/release/ds" ds.1 README.md LICENSE dmg/
          cp -R docs dmg/docs
          cp packaging/macos-install.sh dmg/install.sh
          chmod +x dmg/install.sh
          hdiutil create -volname "ds ${DS_TAG}" \
            -srcfolder dmg -ov -format UDZO "$name.dmg"

      # The runner images ship WiX 3, but do not always put it on PATH.
      - name: Ensure WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
          $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory |
                   Sort-Object Name -Descending | Select-Object -First 1
          }
          "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # wix/main.wxs is committed rather than generated: `cargo wix init`
      # mints a fresh UpgradeCode each time, which would break upgrades
      # between releases.
      - name: Package .msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          $tag = $env:DS_TAG
          cargo wix --no-build --nocapture --target ${{ matrix.target }} `
            --output "ds-$tag-${{ matrix.target }}.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: ds-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
            *.dmg
            *.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `pattern` matters: the docker job uploads digest artifacts to the same
      # run, and without it they would land in dist/ and go out as empty
      # release assets with a line each in SHA256SUMS.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ds-*
          merge-multiple: true

      # A mismatch ships archives named for the tag around a binary that
      # reports the older version -- v0.1.6 and v0.1.7 both went out that way.
      # Fail here rather than warn: nobody reads a warning in a green run, and
      # the fix (bump Cargo.toml, move the tag) is only cheap before publishing.
      - name: Check the tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}."
            echo "::error::Run scripts/release.mjs instead of tagging by hand."
            exit 1
          fi

      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS

      # Idempotent, so a re-run or a re-pushed tag refreshes the assets of the
      # existing release instead of failing on "release already exists".
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "updating the existing $GITHUB_REF_NAME release"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      # pages.yml has a `release: [published]` trigger, but it never fires for
      # a release cut here: GitHub will not start a workflow from an event
      # raised by GITHUB_TOKEN, and the step above uses exactly that. The
      # documented exception is workflow_dispatch, so ask for the deploy
      # outright. Without this the site keeps serving the previous release's
      # download links until something else happens to touch site/ or docs/.
      #
      # continue-on-error keeps pages.yml's independence intact: it is kept
      # separate so a site failure cannot hold up a release, and a failed
      # dispatch must not turn a published release red either.
      - name: Refresh the site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  # The image is built from source by the Dockerfile, so it needs nothing the
  # matrix produced -- but it waits on `build` all the same, because that
  # matrix is the only thing here that runs the test suite, and the Dockerfile
  # runs none. On workflow_dispatch this stops at a build, which is what keeps
  # a dispatch run a full check of everything a tag would publish.
  docker:
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          # A native arm64 runner rather than QEMU: the Dockerfile compiles
          # instead of cross-compiling, and Rust plus the vendored C in ring
          # under emulation turns a few minutes into most of an hour.
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The same guard the release job puts in front of the archives, and it
      # matters more here: an archive is named for the tag, but an image tag is
      # how people pin the thing, so ghcr.io/aminulbd/ds:0.1.8 holding a binary
      # that reports 0.1.7 would be believed.
      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}."
            echo "::error::Run scripts/release.mjs instead of tagging by hand."
            exit 1
          fi

      # ghcr refuses an upper-case path and the owner here is AminulBD.
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}

      # Each architecture is pushed as a bare digest with no tag of its own, so
      # neither arch is briefly published as the whole image; the tags are put
      # on the manifest below, once both are up.
      - name: Build and push
        id: push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p digests
          digest="${{ steps.push.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Both architectures under one name, so `docker pull` picks the right one.
  docker-manifest:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag the manifest
        working-directory: digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(--tag "${IMAGE}:${version}")
          # A prerelease gets its own tag and nothing more: :latest is what an
          # unpinned pull lands on, so v0.2.0-rc1 must not move it.
          case "$version" in
            *-*) echo "prerelease ${version}: leaving :latest where it is" ;;
            *)   tags+=(--tag "${IMAGE}:latest") ;;
          esac
          # One file per architecture, each named for the digest it pushed.
          digests=()
          for d in *; do digests+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
          docker buildx imagetools inspect "${IMAGE}:${version}"
