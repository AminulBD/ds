name: release

on:
  push:
    tags: ["v*"]
  # Lets you exercise the whole build matrix without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target should not hide the other nine.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            test: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # macos-latest is arm64, so the Intel build is a cross-compile
          # against the same SDK and needs no extra tooling.
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      # Docker-based cross-compilation: brings its own linker and C toolchain,
      # which the vendored crypto in rustls needs for musl/arm/i686.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="ds-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "staging/$name"
          cp "target/${{ matrix.target }}/release/ds" README.md LICENSE ds.1 "staging/$name/"
          tar -czf "$name.tar.gz" -C staging "$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $name = "ds-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "staging/$name" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ds.exe" "staging/$name/"
          Copy-Item "README.md","LICENSE" "staging/$name/"
          Compress-Archive -Path "staging/$name" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ds-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}"
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*
