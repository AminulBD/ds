name: pages

# Deploys ds.aminul.dev. Kept entirely separate from release.yml so a failure
# in one can never hold up the other.
on:
  push:
    branches: [main]
    # Only the paths the site is actually built from.
    paths:
      - "site/**"
      - "docs/**"
      - "whois.json"
      - "pricing.json"
      - "private-tlds.json"
      - "eligibility.json"
      - "tld-facts.json"
      - "tld-categories.json"
      - "Cargo.toml"
      - "src/main.rs"
      - ".github/workflows/pages.yml"
  # Refreshes /install with the new asset list as soon as a release is out.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it half way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # /docs/cli is generated from the binary's own --help, so the site build
      # needs a `ds` to run. Debug is plenty and far quicker than a release build.
      - name: Install toolchain
        run: rustup update --no-self-update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ds (for --help)
        run: cargo build --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site deps
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          # Lifts the anonymous GitHub API rate limit when /install asks for
          # the latest release's real asset names.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
